name: One-time repository cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Keep only the download page, guide, logo, and Pages workflow
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 \
            ! -name .git ! -name .github ! -name public ! -name README.md \
            -exec rm -rf -- {} +
          find .github -mindepth 1 -maxdepth 1 ! -name workflows -exec rm -rf -- {} +
          find .github/workflows -type f ! -name deploy.yml ! -name clear-repo.yml -delete
          find .github/workflows -mindepth 2 -delete
          find public -mindepth 1 -maxdepth 1 \
            ! -name index.html ! -name guide.pdf ! -name logo.svg \
            -exec rm -rf -- {} +
          rm -f .github/workflows/clear-repo.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Replace hosted portal with local-app download page" \
            -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin HEAD:main
